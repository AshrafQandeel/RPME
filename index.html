
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="UNSanctionGuard" />
    <meta name="version" content="2.2.0-PREMIUM" />
    <title>UNSanctionGuard - Authoritative Build (v2.2.0-PREMIUM)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f3f4f6;
        -webkit-font-smoothing: antialiased;
      }
      .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #064e3b; border-radius: 10px; }
      
      @keyframes pulse-ring {
        0% { transform: scale(.33); opacity: 1; }
        80%, 100% { opacity: 0; }
      }
      @keyframes slide-infinite {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(300%); }
      }
      .animate-slide-infinite {
        animation: slide-infinite 2s linear infinite;
      }
      .status-pulse {
        position: relative;
      }
      .status-pulse::before {
        content: '';
        position: absolute;
        left: -4px; top: -4px; right: -4px; bottom: -4px;
        border: 2px solid currentColor;
        border-radius: 50%;
        animation: pulse-ring 1.5s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
